[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Redirects für SEO (www zu non-www, falls benötigt)
[[redirects]]
  from = "https://www.gebaeudereinigung-iso-9001.qm-guru.de/*"
  to = "https://gebaeudereinigung-iso-9001.qm-guru.de/:splat"
  status = 301
  force = true

# 404 Handling
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & SEO Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache HTML kurz für schnelle Updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache statische Assets lang
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap & Robots optimal cachen
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"
